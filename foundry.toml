[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
# Robinhood Chain runs Cancun opcodes (TSTORE, TLOAD, MCOPY). Cancun is a safe target.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
# Public endpoint from docs.robinhood.com/chain/connecting/ (rate-limited, not for production).
robinhood = "https://rpc.mainnet.chain.robinhood.com"

[fmt]
line_length = 100
