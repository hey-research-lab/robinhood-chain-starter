# Keeps the SHA-pinned Actions current within their major version, and opens npm security updates for ts/.
# A person merges every pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /ts
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
