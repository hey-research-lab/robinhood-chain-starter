name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundry:
    name: forge build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: v1.8.5
      - run: forge --version
      - run: forge build --sizes
      # Fork tests are skipped here (RUN_FORK_TESTS unset): CI never calls a live RPC.
      - run: forge test -vvv

  typescript:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
